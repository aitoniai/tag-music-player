[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-music-player"
version = "0.1.0"
description = "Play Spotify music on a Raspberry Pi from NFC tags"
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tag-music-player = "tag_music_player.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
